name: Temp status history fix

on:
  push:
    branches:
      - feat/phase-10-parent-progress-insights
    paths:
      - .github/workflows/status-history-fix-temp.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-10-parent-progress-insights
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply status rendering fix
        run: |
          python - <<'PY'
          from pathlib import Path

          vi = Path('lib/i18n/messages.vi.ts')
          text = vi.read_text()
          needle = "    insightDifficulty: 'Mức độ hiện tại của',\n"
          replacement = needle + "    statusAssigned: 'Đã giao',\n    statusInProgress: 'Đang làm',\n    statusSubmitted: 'Đã nộp',\n    statusReviewed: 'Đã xem',\n    statusSkipped: 'Đã bỏ qua',\n"
          if needle not in text:
              raise SystemExit('Vietnamese insertion point not found')
          vi.write_text(text.replace(needle, replacement, 1))

          en = Path('lib/i18n/messages.en.ts')
          text = en.read_text()
          needle = "    insightDifficulty: '',\n"
          replacement = needle + "    statusAssigned: '',\n    statusInProgress: '',\n    statusSubmitted: '',\n    statusReviewed: '',\n    statusSkipped: '',\n"
          if needle not in text:
              raise SystemExit('English insertion point not found')
          en.write_text(text.replace(needle, replacement, 1))

          page = Path('app/(parent)/children/[childId]/history/page.tsx')
          text = page.read_text()
          needle = "                      {new Date(assignment.assignedAt).toLocaleDateString('vi-VN')}\n                      {verdict ? ` · ${t.review[verdictKey(verdict)]}` : ''}\n"
          replacement = "                      {new Date(assignment.assignedAt).toLocaleDateString('vi-VN')}\n                      {` · ${t.history[statusKey(assignment.status)]}`}\n                      {verdict ? ` · ${t.review[verdictKey(verdict)]}` : ''}\n"
          if needle not in text:
              raise SystemExit('History status insertion point not found')
          text = text.replace(needle, replacement, 1)
          helper = """\nfunction statusKey(\n  status: SummaryInput['status'],\n):\n  | 'statusAssigned'\n  | 'statusInProgress'\n  | 'statusSubmitted'\n  | 'statusReviewed'\n  | 'statusSkipped' {\n  if (status === 'assigned') return 'statusAssigned';\n  if (status === 'in_progress') return 'statusInProgress';\n  if (status === 'submitted') return 'statusSubmitted';\n  if (status === 'reviewed') return 'statusReviewed';\n  return 'statusSkipped';\n}\n"""
          marker = "\nfunction verdictKey(verdict: string): 'tooEasy' | 'justRight' | 'tooHard' {"
          if marker not in text:
              raise SystemExit('History helper insertion point not found')
          page.write_text(text.replace(marker, helper + marker, 1))
          PY
      - run: pnpm exec prettier --write 'app/(parent)/children/[childId]/history/page.tsx' lib/i18n/messages.vi.ts lib/i18n/messages.en.ts tests/unit/progress-page-contract.test.ts
      - run: pnpm test:unit
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/(parent)/children/[childId]/history/page.tsx' lib/i18n/messages.vi.ts lib/i18n/messages.en.ts tests/unit/progress-page-contract.test.ts
          git commit -m 'fix: show assignment status in progress history'
          git push origin HEAD:feat/phase-10-parent-progress-insights
