name: Temporary Phase 11 canonical production smoke

on:
  push:
    paths:
      - .github/workflows/tmp-phase11-canonical-production-smoke.yml

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-11-production-launch-readiness
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run exact production smoke command
        env:
          PRODUCTION_BASE_URL: https://nuoidaycon.vercel.app
        run: pnpm smoke:production --json
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-phase11-canonical-production-smoke.yml
          git commit -m "chore: remove temporary Phase 11 canonical production smoke workflow"
          git push origin HEAD:feat/phase-11-production-launch-readiness
