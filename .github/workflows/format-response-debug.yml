name: Format response debug

on:
  push:
    branches:
      - feat/full-catalog-60

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print Prettier diff
        run: |
          pnpm exec prettier components/activity-player.tsx --write
          git diff -- components/activity-player.tsx
          exit 1
