name: Temporary Phase 11 HTTP probe

on:
  push:
    paths:
      - .github/workflows/tmp-phase11-http-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-11-production-launch-readiness
      - name: Probe public production routes
        shell: bash
        run: |
          set -u
          base='https://nuoidaycon-eight.vercel.app'
          for path in / /login /dashboard /play /settings; do
            echo "===== ${path} ====="
            curl --silent --show-error --max-time 15 --output /dev/null --dump-header - "${base}${path}" || true
          done
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-phase11-http-probe.yml
          git commit -m "chore: remove temporary Phase 11 HTTP probe workflow"
          git push origin HEAD:feat/phase-11-production-launch-readiness
