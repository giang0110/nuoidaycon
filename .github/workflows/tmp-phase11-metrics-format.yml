name: Temporary Phase 11 metrics formatter

on:
  push:
    branches:
      - feat/phase-11-production-launch-readiness

permissions:
  contents: write

jobs:
  format-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-11-production-launch-readiness
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format metrics readiness files
        run: >-
          pnpm exec prettier --write
          lib/domain/readiness/metrics.ts
          tests/unit/readiness-metrics.test.ts

      - name: Focused verification
        run: |
          pnpm typecheck
          pnpm lint
          pnpm exec vitest run --project unit tests/unit/product-metrics.test.ts tests/unit/readiness-metrics.test.ts

      - name: Commit formatted files and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/domain/readiness/metrics.ts tests/unit/readiness-metrics.test.ts
          git rm .github/workflows/tmp-phase11-metrics-format.yml
          git commit -m 'style: format metrics readiness files'
          git push origin HEAD:feat/phase-11-production-launch-readiness
