name: Temp format history

on:
  push:
    branches:
      - feat/phase-10-parent-progress-insights
    paths:
      - .github/workflows/format-history-temp.yml

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write 'app/(parent)/children/[childId]/history/page.tsx'
      - name: Print formatted file
        run: |
          echo '---FORMATTED-FILE-START---'
          cat 'app/(parent)/children/[childId]/history/page.tsx'
          echo '---FORMATTED-FILE-END---'
