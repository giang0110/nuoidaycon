name: Phase 11 temporary formatter

on:
  push:
    branches:
      - feat/phase-11-production-launch-readiness
    paths:
      - .github/workflows/phase11-format-temp.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-11-production-launch-readiness
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write lib/domain/readiness/http.ts tests/unit/production-smoke.test.ts
      - name: Commit formatted files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/domain/readiness/http.ts tests/unit/production-smoke.test.ts
          git diff --cached --quiet && exit 0
          git commit -m 'style: format Phase 11 HTTP readiness files'
          git push origin HEAD:feat/phase-11-production-launch-readiness
