name: Temporary Phase 11 formatter

on:
  push:
    branches:
      - feat/phase-11-production-launch-readiness

permissions:
  contents: write

jobs:
  format-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-11-production-launch-readiness
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format all Phase 11 files
        run: |
          pnpm exec prettier --write \
            docs/superpowers/plans/2026-09-05-production-launch-readiness.md \
            docs/superpowers/specs/2026-09-05-production-launch-readiness-design.md \
            lib/domain/readiness/http.ts \
            lib/domain/readiness/report.ts \
            scripts/production-smoke.ts \
            tests/unit/production-smoke.test.ts \
            tests/unit/readiness-report.test.ts \
            package.json

      - name: Focused verification
        run: |
          pnpm typecheck
          pnpm exec vitest run --project unit tests/unit/readiness-report.test.ts tests/unit/production-smoke.test.ts

      - name: Commit normalized files and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/superpowers/plans/2026-09-05-production-launch-readiness.md \
            docs/superpowers/specs/2026-09-05-production-launch-readiness-design.md \
            lib/domain/readiness/http.ts \
            lib/domain/readiness/report.ts \
            scripts/production-smoke.ts \
            tests/unit/production-smoke.test.ts \
            tests/unit/readiness-report.test.ts \
            package.json
          git rm .github/workflows/tmp-phase11-format.yml
          git commit -m 'style: normalize Phase 11 readiness files'
          git push origin HEAD:feat/phase-11-production-launch-readiness
