name: Temporary Phase 11 DB formatter

on:
  push:
    branches:
      - feat/phase-11-production-launch-readiness

permissions:
  contents: write

jobs:
  format-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-11-production-launch-readiness
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format database readiness files
        run: >-
          pnpm exec prettier --write
          lib/domain/readiness/database.ts
          scripts/production-db-readiness.ts
          tests/unit/database-readiness.test.ts
          package.json

      - name: Focused verification
        run: |
          pnpm typecheck
          pnpm lint
          pnpm exec vitest run --project unit tests/unit/database-readiness.test.ts

      - name: Commit formatted files and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/domain/readiness/database.ts scripts/production-db-readiness.ts tests/unit/database-readiness.test.ts package.json
          git rm .github/workflows/tmp-phase11-db-format.yml
          git commit -m 'style: format database readiness files'
          git push origin HEAD:feat/phase-11-production-launch-readiness
