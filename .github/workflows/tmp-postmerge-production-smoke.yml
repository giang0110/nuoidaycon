name: Temporary post-merge production smoke

on:
  push:
    branches:
      - feat/phase-11-production-launch-readiness

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run exact production smoke
        env:
          PRODUCTION_BASE_URL: https://nuoidaycon.vercel.app
        run: pnpm smoke:production --json
