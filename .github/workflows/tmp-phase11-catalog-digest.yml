name: Temporary Phase 11 catalog digest

on:
  push:
    paths:
      - .github/workflows/tmp-phase11-catalog-digest.yml

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-11-production-launch-readiness
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compute canonical seed digest
        shell: bash
        run: |
          pnpm exec tsx -e "import {createHash} from 'node:crypto'; import {ALL_SEEDS} from './content/seeds'; const rows=ALL_SEEDS.map(s=>[s.slug,s.type,s.status,s.provenance.source,String(s.audience.minAge),String(s.audience.maxAge),s.response.mode].join(String.fromCharCode(31))).sort(); const body=rows.join(String.fromCharCode(30)); console.log(JSON.stringify({count:rows.length,md5:createHash('md5').update(body).digest('hex')}));"
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-phase11-catalog-digest.yml
          git commit -m "chore: remove temporary Phase 11 catalog digest workflow"
          git push origin HEAD:feat/phase-11-production-launch-readiness
