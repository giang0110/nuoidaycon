name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Typecheck, lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # Every non-Anthropic provider stays banned, and the Anthropic SDK must
      # be imported by exactly one file (the provider adapter).
      - name: Provider abstraction
        run: pnpm check:no-llm

      # Secrets, service-role confinement, domain purity, RLS coverage,
      # storage privacy, EXIF removal, CSP and logging hygiene.
      - name: Security audit
        run: pnpm audit:security

      - name: i18n key alignment
        run: pnpm check:i18n

      - name: Unit tests
        run: pnpm test:unit

      - name: Seed content validation
        run: pnpm validate:content

  database:
    name: Database security (RLS matrix)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nuoidaycon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # A throwaway service container, never a hosted project.
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nuoidaycon_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Applies the local auth/storage shim plus every migration, from scratch.
      # The suite fails loudly if TEST_DATABASE_URL is unset rather than
      # skipping silently.
      - name: Cross-tenant RLS matrix, schema constraints and storage policies
        run: pnpm test:integration

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Build
        run: pnpm build

      # Print tests load the real Worksheet component rendered with the real
      # stylesheet; the print routes themselves need an authenticated parent.
      - name: Render worksheets for print tests
        run: pnpm worksheets:render

      - name: Run Playwright
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
