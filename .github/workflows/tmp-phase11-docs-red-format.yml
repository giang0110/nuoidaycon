name: Temporary Phase 11 docs RED formatter

on:
  push:
    branches:
      - feat/phase-11-production-launch-readiness

permissions:
  contents: write

jobs:
  format-and-confirm-red:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-11-production-launch-readiness
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format docs contract test
        run: pnpm exec prettier --write tests/unit/readiness-docs-contract.test.ts

      - name: Confirm RED is from stale documentation
        run: |
          if pnpm exec vitest run --project unit tests/unit/readiness-docs-contract.test.ts; then
            echo 'Expected docs contract to be RED before docs update, but it passed.' >&2
            exit 1
          fi
          echo 'RED confirmed: docs contract fails before documentation update.'

      - name: Commit formatted test and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/unit/readiness-docs-contract.test.ts
          git rm .github/workflows/tmp-phase11-docs-red-format.yml
          git commit -m 'style: format readiness docs contract test'
          git push origin HEAD:feat/phase-11-production-launch-readiness
